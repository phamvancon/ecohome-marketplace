<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    query,
    onSnapshot,
    serverTimestamp,
    doc,
    deleteDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";


// FIREBASE CONFIG MỚI
const firebaseConfig = {
    apiKey: "AIzaSyDueCwieBqfBHSjdKMZ5O-Y8Z1rPB-sFVM",
    authDomain: "ecohome-marketplace-97aa6.firebaseapp.com",
    projectId: "ecohome-marketplace-97aa6",
    storageBucket: "ecohome-marketplace-97aa6.firebasestorage.app",
    messagingSenderId: "1010934843766",
    appId: "1:1010934843766:web:c2ad5a5dbf43913bd8d257",
    measurementId: "G-HV0LS2FGM1"
};


// INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let allPosts = [];
let currentCategory = 'Tất cả';
let selectedFiles = [];


// LOGIN GOOGLE
window.loginWithGoogle = async () => {
    try {
        await signInWithPopup(auth, provider);
        alert("Đăng nhập thành công!");
        document.getElementById("modal-login")?.classList.add("hidden");
    } catch (error) {
        console.error(error);
        alert("Lỗi đăng nhập: " + error.message);
    }
};


// LOGOUT
window.logout = async () => {
    await signOut(auth);
};



// AUTH STATE
onAuthStateChanged(auth, (user) => {

    currentUser = user;

    const authSection = document.getElementById("auth-section");

    if (!authSection) return;

    if (user) {

        authSection.innerHTML = `
            <div class="flex items-center gap-2">

                <img src="${user.photoURL || ''}"
                    class="w-8 h-8 rounded-full">

                <span class="text-white text-xs hidden lg:block">
                    ${user.displayName || 'User'}
                </span>

                <button onclick="logout()"
                    class="bg-red-500 text-white px-3 py-1 rounded-full text-xs">
                    Đăng xuất
                </button>

            </div>
        `;

    } else {

        authSection.innerHTML = `
            <button onclick="toggleModal('modal-login')"
                class="text-white text-xs font-bold">
                Đăng nhập
            </button>
        `;
    }
});



// PREVIEW ẢNH
window.previewImages = (event) => {
    const files = Array.from(event.target.files);

    if (selectedFiles.length + files.length > 5) {
        alert("Chỉ được tối đa 5 ảnh");
        return;
    }

    selectedFiles = [...selectedFiles, ...files];

    renderPreviewImages();
};

function renderPreviewImages() {
    const wrapper = document.getElementById("image-upload-wrapper");
    const trigger = document.getElementById("upload-trigger");

    wrapper.querySelectorAll(".preview-item").forEach(el => el.remove());

    selectedFiles.forEach((file, index) => {
        const url = URL.createObjectURL(file);

        const div = document.createElement("div");

        div.className = "preview-item relative aspect-square rounded-xl overflow-hidden";

        div.innerHTML = `
            <img src="${url}" class="w-full h-full object-cover">

            <button onclick="removeImage(${index})"
                class="absolute top-1 right-1 bg-black/70 text-white w-5 h-5 rounded-full text-xs">
                ×
            </button>
        `;

        wrapper.insertBefore(div, trigger);
    });

    trigger.style.display = selectedFiles.length >= 5 ? "none" : "flex";
}


window.removeImage = (index) => {
    selectedFiles.splice(index, 1);
    renderPreviewImages();
};


// ĐĂNG TIN
window.handlePostSubmit = async (e) => {
    e.preventDefault();

    if (!currentUser) {
        alert("Vui lòng đăng nhập");
        return;
    }

    const btn = document.getElementById("submit-btn");

    btn.disabled = true;
    btn.innerText = "ĐANG ĐĂNG...";

    try {

        let imageUrls = [];

        for (const file of selectedFiles) {

            const storageRef = ref(storage, "posts/" + Date.now() + "_" + file.name);

            await uploadBytes(storageRef, file);

            const url = await getDownloadURL(storageRef);

            imageUrls.push(url);
        }

        await addDoc(collection(db, "posts"), {
            title: document.getElementById("p-title").value,
            price: document.getElementById("p-price").value,
            category: document.getElementById("p-category").value,
            phone: document.getElementById("p-phone").value,
            desc: document.getElementById("p-desc").value,
            images: imageUrls,
            userName: currentUser.displayName,
            userAvatar: currentUser.photoURL,
            createdAt: serverTimestamp(),
            isVip: false
        });

        alert("Đăng tin thành công");

        document.getElementById("post-form").reset();

        selectedFiles = [];

        renderPreviewImages();

        toggleModal("modal-post");

    } catch (error) {

        console.error(error);

        alert(error.message);

    }

    btn.disabled = false;
    btn.innerText = "XÁC NHẬN ĐĂNG TIN";
};


// LOAD POSTS REALTIME
onSnapshot(query(collection(db, "posts")), (snapshot) => {

    allPosts = [];

    snapshot.forEach(docSnap => {

        allPosts.push({
            id: docSnap.id,
            ...docSnap.data()
        });

    });

    renderPosts();
});


// HIỂN THỊ POSTS
function renderPosts() {

    const normalList = document.getElementById("normal-list");

    normalList.innerHTML = "";

    if (allPosts.length === 0) {

        normalList.innerHTML = `
            <div class="col-span-full text-center py-10 text-gray-400">
                Chưa có tin đăng nào
            </div>
        `;

        return;
    }

    allPosts.reverse().forEach(post => {

        const image = post.images?.[0] || "";

        normalList.innerHTML += `
            <div class="bg-white rounded-3xl overflow-hidden shadow hover:shadow-xl transition">

                <div class="h-44 bg-gray-100 overflow-hidden">
                    <img src="${image}"
                        class="w-full h-full object-cover">
                </div>

                <div class="p-4">

                    <div class="text-[10px] uppercase font-bold text-green-600 mb-2">
                        ${post.category}
                    </div>

                    <h3 class="font-bold text-sm line-clamp-2 h-10">
                        ${post.title}
                    </h3>

                    <div class="mt-3 text-green-700 font-black">
                        ${post.price}
                    </div>

                    <a href="https://zalo.me/${post.phone}"
                        target="_blank"
                        class="mt-3 inline-block text-blue-600 text-xs font-bold">
                        Liên hệ Zalo →
                    </a>

                </div>
            </div>
        `;
    });
}


// MODAL
window.toggleModal = (id) => {
    document.getElementById(id).classList.toggle("hidden");
};

</script>
